# WCD9335 behind the ADSP (q6asm front ends, SLIMbus back ends).
# - The SLIMbus AFE ports only start with S16LE at 48 kHz.
# - Playback: the usual postmarketOS Qualcomm settings (soc-qcom 51-qcom.conf).
# - Capture: q6asm-dai allows at most 4096-byte capture periods
#   (CAPTURE_MAX_PERIOD_SIZE), i.e. 1024 frames of S16LE stereo; larger
#   periods make every capture open fail with EINVAL.
monitor.alsa.rules = [
  {
    matches = [
      {
        node.name = "~alsa_output.*"
      }
    ]
    actions = {
      update-props = {
        audio.format           = "S16LE"
        audio.rate             = 48000
        api.alsa.period-size   = 4096
        api.alsa.period-num    = 6
        api.alsa.headroom      = 512
      }
    }
  }
  {
    matches = [
      {
        node.name = "~alsa_input.*"
      }
    ]
    actions = {
      update-props = {
        audio.format           = "S16LE"
        audio.rate             = 48000
        api.alsa.period-size   = 1024
        api.alsa.period-num    = 4
        api.alsa.headroom      = 512
      }
    }
  }
  {
    # Rank the jack's nodes above the built-in ones, which by PCM number they
    # would not be. While nothing is plugged in their route is unavailable, so
    # they only take over while plugged.
    matches = [
      {
        node.name = "~alsa_output.*HiFi__Headphones__sink"
      }
    ]
    actions = {
      update-props = {
        priority.session = 1100
        priority.driver  = 1100
      }
    }
  }
  {
    matches = [
      {
        node.name = "~alsa_input.*HiFi__Headset__source"
      }
    ]
    actions = {
      update-props = {
        priority.session = 2100
        priority.driver  = 2100
      }
    }
  }
]
