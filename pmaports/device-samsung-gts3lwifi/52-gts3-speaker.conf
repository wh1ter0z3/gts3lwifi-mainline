# The Tab S3's speaker sound (docs/audio.md, "Speaker sound"): everything
# played on the built-in speakers goes through the gts3_speaker plugin, which
# reproduces the stock firmware's speaker processing. A WirePlumber smart
# filter: it sits in front of the speaker sink only, so headphones and
# Bluetooth get the plain signal, and the speakers stay the device users pick.
context.modules = [
    { name = libpipewire-module-filter-chain
        args = {
            node.description = "Speaker sound (Tab S3)"
            media.name       = "Speaker sound (Tab S3)"
            filter.graph = {
                nodes = [
                    {
                        type   = ladspa
                        name   = speaker
                        plugin = gts3_speaker
                        label  = gts3_speaker
                        control = { "Boost" = 0.0 }
                    }
                ]
            }
            audio.channels = 2
            audio.position = [ FL FR ]
            capture.props = {
                node.name           = "effect_input.gts3_speaker"
                media.class         = Audio/Sink
                filter.smart        = true
                filter.smart.name   = "gts3-speaker"
                filter.smart.target = { node.name = "alsa_output.platform-sound.HiFi__Speaker__sink" }
            }
            playback.props = {
                node.name    = "effect_output.gts3_speaker"
                node.passive = true
            }
        }
    }
]
