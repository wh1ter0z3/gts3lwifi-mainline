# Samsung Galaxy Tab S3 (gts3lwifi): WCD9335 on SLIMbus behind the ADSP.
# Playback: MultiMedia2 -> SLIMBUS_6_RX -> AIF4_PB -> SLIM RX5/RX6 -> HPH.
# Capture:  MultiMedia3 <- SLIMBUS_0_TX <- AIF1_CAP <- SLIM TX0/TX1
#           <- DEC0/DEC1 <- AMIC3 (main mic) / AMIC4 (sub mic).
# Headset:  MultiMedia4 <- SLIMBUS_1_TX <- AIF2_CAP <- SLIM TX2/TX3
#           <- DEC2/DEC3 <- AMIC2. Its own stream, like the headphones: two
#           devices on one PCM would conflict, and PipeWire would then change
#           profile and reopen the PCM at every jack event.
# Headphone settings follow Samsung's mixer_paths_tasha.xml ("headset").
# Speakers: MultiMedia1 -> PRIMARY_TDM_RX_0 (bottom pair) and QUAT_TDM_RX_0
#           (top pair), four Richtek RT5508 amplifiers. In landscape with the
#           home button on the right, the top pair plays left, the bottom
#           pair right.

SectionVerb {
	EnableSequence [
		cset "name='SLIM RX0 MUX' ZERO"
		cset "name='SLIM RX1 MUX' ZERO"
		cset "name='SLIM RX2 MUX' ZERO"
		cset "name='SLIM RX3 MUX' ZERO"
		cset "name='SLIM RX4 MUX' ZERO"
		cset "name='SLIM RX5 MUX' AIF4_PB"
		cset "name='SLIM RX6 MUX' AIF4_PB"
		cset "name='SLIM RX7 MUX' ZERO"
		cset "name='SLIMBUS_6_RX Audio Mixer MultiMedia2' 1"
		cset "name='PRIMARY_TDM_RX_0 Audio Mixer MultiMedia1' 1"

		cset "name='MultiMedia3 Mixer SLIMBUS_0_TX' 1"
		cset "name='AIF1_CAP Mixer SLIM TX0' 1"
		cset "name='AIF1_CAP Mixer SLIM TX1' 1"
		cset "name='SLIM TX0 MUX' DEC0"
		cset "name='SLIM TX1 MUX' DEC1"
		cset "name='ADC MUX0' AMIC"
		cset "name='ADC MUX1' AMIC"

		cset "name='MultiMedia4 Mixer SLIMBUS_1_TX' 1"
		cset "name='AIF2_CAP Mixer SLIM TX2' 1"
		cset "name='AIF2_CAP Mixer SLIM TX3' 1"
		cset "name='SLIM TX2 MUX' DEC2"
		cset "name='SLIM TX3 MUX' DEC3"
		cset "name='ADC MUX2' AMIC"
		cset "name='ADC MUX3' AMIC"
	]

	# The top speaker pair lives on QUAT_TDM_RX_0. The SM-T825 (gts3llte)
	# device tree leaves it out, and routing MultiMedia1 into that unbacked
	# back-end makes hw_params fail for the whole PCM -- PulseAudio then finds
	# no working profile and the card never appears. Gate the route on the
	# top amplifiers being present, matching the Speaker device's If.top.
	If.toproute {
		Condition {
			Type ControlExists
			Control "name='Top 1 DAC Volume'"
		}
		True.EnableSequence [
			cset "name='QUAT_TDM_RX_0 Audio Mixer MultiMedia1' 1"
		]
	}

	# No DisableSequence for the shared routing: PipeWire opens each PCM
	# through its own UCM context, and tearing the ADSP routes down when one
	# of them closes cut the other direction off mid-stream.

	Value {
		TQ "HiFi"
	}
}

SectionDevice."Speaker" {
	Comment "Speakers"

	# DAC Volume: 255 is 0 dB, 0.5 dB per step (measured). The amplifiers'
	# speaker protection is not used, so stay 15 dB below full scale and
	# leave the rest to the software volume.
	# The SM-T825 device tree leaves the top pair out for now.
	If.top {
		Condition {
			Type ControlExists
			Control "name='Top 1 DAC Volume'"
		}
		True.EnableSequence [
			cset "name='Top 1 DAC Volume' 225"
			cset "name='Top 2 DAC Volume' 225"
			cset "name='Bottom 1 DAC Volume' 225"
			cset "name='Bottom 2 DAC Volume' 225"
		]
		False.EnableSequence [
			cset "name='Bottom 1 DAC Volume' 225"
			cset "name='Bottom 2 DAC Volume' 225"
		]
	}

	Value {
		PlaybackPriority 200
		PlaybackPCM "hw:${CardId},0"
		PlaybackChannels 2
	}
}

SectionDevice."Headphones" {
	Comment "Headphones"

	EnableSequence [
		cset "name='RX INT1_2 MUX' RX5"
		cset "name='RX INT2_2 MUX' RX6"
		cset "name='RX INT1 DEM MUX' CLSH_DSM_OUT"
		cset "name='RX INT2 DEM MUX' CLSH_DSM_OUT"
		cset "name='RX HPH Mode' 'Class-H Low Power'"
		cset "name='COMP1 Switch' 1"
		cset "name='COMP2 Switch' 1"
		cset "name='HPHL Volume' 20"
		cset "name='HPHR Volume' 20"
		cset "name='RX1 Mix Digital Volume' 74"
		cset "name='RX2 Mix Digital Volume' 74"
	]

	DisableSequence [
		cset "name='RX INT1_2 MUX' ZERO"
		cset "name='RX INT2_2 MUX' ZERO"
		cset "name='COMP1 Switch' 0"
		cset "name='COMP2 Switch' 0"
	]

	Value {
		PlaybackPriority 300
		PlaybackPCM "hw:${CardId},1"
		PlaybackChannels 2
		JackControl "Headphone Jack"
	}
}

SectionDevice."Mic" {
	Comment "Built-in microphones (main, sub)"

	EnableSequence [
		cset "name='AMIC MUX0' ADC3"
		cset "name='AMIC MUX1' ADC4"
		cset "name='ADC3 Volume' 16"
		cset "name='ADC4 Volume' 16"
	]

	DisableSequence [
		cset "name='AMIC MUX0' ZERO"
		cset "name='AMIC MUX1' ZERO"
	]

	Value {
		CapturePriority 100
		CapturePCM "hw:${CardId},2"
		CaptureChannels 2
	}
}

SectionDevice."Headset" {
	Comment "Headset microphone"

	# One microphone on two channels: the back end is always stereo.
	# ADC2 Volume at its top: about 1.5 dB per step, and speech into EarPods
	# peaks at 10 to 40 %. Samsung's mixer_paths_tasha.xml has 7, far too quiet here.
	EnableSequence [
		cset "name='AMIC MUX2' ADC2"
		cset "name='AMIC MUX3' ADC2"
		cset "name='ADC2 Volume' 20"
	]

	DisableSequence [
		cset "name='AMIC MUX2' ZERO"
		cset "name='AMIC MUX3' ZERO"
	]

	Value {
		CapturePriority 200
		CapturePCM "hw:${CardId},3"
		CaptureChannels 2
		JackControl "Mic Jack"
	}
}
