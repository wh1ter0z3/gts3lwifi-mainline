# Galaxy Tab S3: gnss-share with the qmi_loc driver (the GNSS engine in the
# modem DSP), only with a device tree that enables the modem DSP
# (the main DT). It starts a GNSS session only while a client (e.g.
# geoclue for an app that asks for an exact location) is connected.
[Unit]
ConditionPathExists=/sys/bus/platform/devices/2080000.remoteproc

[Service]
ExecStart=
ExecStart=/usr/bin/gnss-share -c /etc/gnss-share-qmi-loc.conf
