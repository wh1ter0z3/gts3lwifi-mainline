# Wi-Fi power save off: with it, the QCA6174 answers an idle ping after
# 100-400 ms (300 ms reported on an SM-T825Y, 126 ms average measured on an
# SM-T820); without it, about 16 ms. In suspend the link is down anyway.
# Override in /etc/NetworkManager/conf.d/ (wifi.powersave = 3 turns it on).
[connection]
wifi.powersave = 2
