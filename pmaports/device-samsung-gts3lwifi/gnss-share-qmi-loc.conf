# gnss-share on the Galaxy Tab S3: the GNSS engine in the modem DSP, through
# its QMI location service (docs/gnss.md). geoclue reads this socket
# (/etc/geoclue/conf.d/gnss-share.conf from gnss-share-geoclue).
socket="/run/gnss-share.sock"
group="geoclue"
device_driver="qmi_loc"
agps_directory="/var/cache/gnss-share"
