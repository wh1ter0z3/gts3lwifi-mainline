# Galaxy Tab S3: rmtfs serves the modem DSP (MSS) its file system and, with
# -s, boots it. Only a device tree that enables the MSS (dts/test/gnss.dtsi)
# has one; without it rmtfs -s exits ("Failed to get rprocfd") and restarts
# every second until systemd gives up. So run only once the MSS's
# remoteproc exists; 90-gts3-gnss.rules starts rmtfs when it appears.
[Unit]
ConditionPathExistsGlob=/sys/bus/platform/devices/2080000.remoteproc/remoteproc/remoteproc*
# The modem reads its configuration over QRTR TFTP while it boots
Wants=tqftpserv.service
After=tqftpserv.service
