%YAML 1.2
---
$id: http://devicetree.org/schemas/power/supply/siliconmitus,sm5705-fuel-gauge.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Silicon Mitus SM5705 fuel gauge

maintainers:
  - psigod <psigod@example.com>

description:
  The fuel gauge part of the SM5705 charger and fuel gauge IC. It sits on
  its own I2C address and measures the battery voltage and current and
  computes the state of charge. Its temperature register reads the IC, which
  also holds the charger, so a board with a battery thermistor on an ADC should
  describe that.

allOf:
  - $ref: power-supply.yaml#

properties:
  compatible:
    const: siliconmitus,sm5705-fuel-gauge

  reg:
    maxItems: 1

  interrupts:
    maxItems: 1
    description: Low state of charge alert

  monitored-battery: true

  power-supplies: true

  io-channels:
    maxItems: 1
    description: ADC channel of the battery thermistor

  io-channel-names:
    const: therm

  temperature-lookup-table:
    $ref: /schemas/types.yaml#/definitions/int32-matrix
    description:
      The ADC's raw code at each temperature, with the codes rising.
    items:
      items:
        - description: temperature in millidegrees Celsius
        - description: raw ADC code

dependencies:
  io-channels: [ io-channel-names, temperature-lookup-table ]

required:
  - compatible
  - reg

additionalProperties: false

examples:
  - |
    i2c {
      #address-cells = <1>;
      #size-cells = <0>;

      fuel-gauge@71 {
        compatible = "siliconmitus,sm5705-fuel-gauge";
        reg = <0x71>;
        monitored-battery = <&battery>;
      };
    };
